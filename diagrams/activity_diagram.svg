<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    
    <!-- Activity box drop shadow -->
    <filter id="actShadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="900" height="1150" fill="#ffffff"/>
  
  <!-- ==================== HEADER (Exact style as reference image) ==================== -->
  <g id="header-group">
    <text x="450" y="42" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Activity Diagram</text>
    <text x="450" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#0284c7" letter-spacing="0.2">BLOOD DONATION &amp; DONOR AVAILABILITY LIFECYCLE WORKFLOW (SCENARIO 15)</text>
    <text x="450" y="88" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Student: Karan Raajaa V (732925ITR045) | Class: 25IT3A | Department of IT, VCET Erode - 12</text>
    <line x1="120" y1="102" x2="780" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  
  <!-- ==================== CONNECTOR LINES LAYER ==================== -->
  <g id="control-flow-lines" stroke="#0f172a" stroke-width="1.8" fill="none" stroke-linecap="round">
    <!-- Start to Receive Donor -->
    <line x1="450" y1="135" x2="450" y2="160" marker-end="url(#arrow)"/>
    
    <!-- Receive Donor to Decision 1 (Age) -->
    <line x1="450" y1="210" x2="450" y2="240" marker-end="url(#arrow)"/>
    
    <!-- Decision 1 [Invalid Age] to Reject -->
    <line x1="425" y1="255" x2="200" y2="255" marker-end="url(#arrow)"/>
    
    <!-- Decision 1 [Valid Age] to Check History -->
    <line x1="450" y1="270" x2="450" y2="305" marker-end="url(#arrow)"/>
    
    <!-- Check History to Decision 2 (Cooldown) -->
    <line x1="450" y1="355" x2="450" y2="385" marker-end="url(#arrow)"/>
    
    <!-- Decision 2 [Cooldown Active <90d] to Reject -->
    <line x1="475" y1="400" x2="700" y2="400" marker-end="url(#arrow)"/>
    
    <!-- Decision 2 [Eligible >=90d] to Screen Vitals -->
    <line x1="450" y1="415" x2="450" y2="450" marker-end="url(#arrow)"/>
    
    <!-- Screen Vitals to Decision 3 (Hemoglobin) -->
    <line x1="450" y1="500" x2="450" y2="530" marker-end="url(#arrow)"/>
    
    <!-- Decision 3 [Hgb < 12.0] to Defer -->
    <path d="M 425,545 L 200,545 L 200,515" marker-end="url(#arrow)"/>
    
    <!-- Decision 3 [Hgb >= 12.0] to Draw Blood -->
    <line x1="450" y1="560" x2="450" y2="595" marker-end="url(#arrow)"/>
    
    <!-- Draw Blood to Fork Bar -->
    <line x1="450" y1="645" x2="450" y2="675" marker-end="url(#arrow)"/>
    
    <!-- Fork Bar to Parallel Left: Post-Care & Rest -->
    <path d="M 300,685 L 300,720" marker-end="url(#arrow)"/>
    
    <!-- Post-Care to Issue Certificate -->
    <line x1="300" y1="770" x2="300" y2="805" marker-end="url(#arrow)"/>
    
    <!-- Fork Bar to Parallel Right: Update Inventory -->
    <path d="M 600,685 L 600,720" marker-end="url(#arrow)"/>
    
    <!-- Update Inventory to Buffer Safety Audit -->
    <line x1="600" y1="770" x2="600" y2="805" marker-end="url(#arrow)"/>
    
    <!-- Parallel Left down to Join Bar -->
    <path d="M 300,855 L 300,890" marker-end="url(#arrow)"/>
    
    <!-- Parallel Right down to Join Bar -->
    <path d="M 600,855 L 600,890" marker-end="url(#arrow)"/>
    
    <!-- Join Bar to Log Session -->
    <line x1="450" y1="900" x2="450" y2="930" marker-end="url(#arrow)"/>
    
    <!-- Log Session to Merge Node -->
    <line x1="450" y1="980" x2="450" y2="1010" marker-end="url(#arrow)"/>
    
    <!-- Rejection Lines Flowing to Merge Node -->
    <path d="M 200,285 L 200,1025 L 435,1025" marker-end="url(#arrow)"/>
    <path d="M 700,430 L 700,1025 L 465,1025" marker-end="url(#arrow)"/>
    
    <!-- Merge Node to Final End Bullseye -->
    <line x1="450" y1="1040" x2="450" y2="1075" marker-end="url(#arrow)"/>
  </g>
  
  <!-- ==================== INITIAL NODE ==================== -->
  <g id="initial-node">
    <circle cx="450" cy="125" r="11" fill="#0f172a"/>
  </g>
  
  <!-- ==================== ACTIONS / ACTIVITIES (Rounded Blue Rectangles) ==================== -->
  <!-- Action 1: Receive Donor Registration -->
  <g id="act-receive" filter="url(#actShadow)">
    <rect x="360" y="160" width="180" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="450" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Receive Donor</text>
    <text x="450" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">Registration</text>
  </g>
  
  <!-- Decision 1: Age Check -->
  <g id="dec-age">
    <polygon points="450,240 465,255 450,270 435,255" fill="#38bdf8" stroke="#0284c7" stroke-width="1.6"/>
    <text x="458" y="295" font-size="10" font-weight="700" fill="#059669">[18 &lt;= age &lt;= 65]</text>
    <text x="310" y="250" font-size="10" font-weight="700" fill="#dc2626">[age &lt; 18 or &gt; 65]</text>
  </g>
  
  <!-- Rejection 1: Underage/Over-age -->
  <g id="act-reject-age" filter="url(#actShadow)">
    <rect x="120" y="230" width="160" height="50" rx="14" ry="14" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
    <text x="200" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">Reject Donor</text>
    <text x="200" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">(Age Ineligible)</text>
  </g>
  
  <!-- Action 2: Check Donation History & Cooldown -->
  <g id="act-history" filter="url(#actShadow)">
    <rect x="350" y="305" width="200" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="450" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Check Donation History</text>
    <text x="450" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">&amp; 90-Day Cooldown</text>
  </g>
  
  <!-- Decision 2: Cooldown Check -->
  <g id="dec-cooldown">
    <polygon points="450,385 465,400 450,415 435,400" fill="#38bdf8" stroke="#0284c7" stroke-width="1.6"/>
    <text x="458" y="440" font-size="10" font-weight="700" fill="#059669">[days &gt;= 90 or New]</text>
    <text x="510" y="394" font-size="10" font-weight="700" fill="#dc2626">[days &lt; 90]</text>
  </g>
  
  <!-- Rejection 2: Cooldown Active -->
  <g id="act-reject-cooldown" filter="url(#actShadow)">
    <rect x="620" y="375" width="160" height="50" rx="14" ry="14" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
    <text x="700" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">Block: Active Cooldown</text>
    <text x="700" y="411" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">(Days Remaining)</text>
  </g>
  
  <!-- Action 3: Screen Vitals & Hemoglobin -->
  <g id="act-screen" filter="url(#actShadow)">
    <rect x="350" y="450" width="200" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="450" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Screen Vitals &amp;</text>
    <text x="450" y="487" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">Hemoglobin Level</text>
  </g>
  
  <!-- Decision 3: Hemoglobin Check -->
  <g id="dec-hgb">
    <polygon points="450,530 465,545 450,560 435,545" fill="#38bdf8" stroke="#0284c7" stroke-width="1.6"/>
    <text x="458" y="585" font-size="10" font-weight="700" fill="#059669">[Hgb &gt;= 12.0 g/dL]</text>
    <text x="310" y="540" font-size="10" font-weight="700" fill="#dc2626">[Hgb &lt; 12.0 g/dL]</text>
  </g>
  
  <!-- Action 4: Draw Blood Unit -->
  <g id="act-draw" filter="url(#actShadow)">
    <rect x="360" y="595" width="180" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="450" y="617" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Draw 1 Unit Blood</text>
    <text x="450" y="632" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">(Whole Blood 450 mL)</text>
  </g>
  
  <!-- ==================== FORK BAR (CONCURRENCY) ==================== -->
  <g id="fork-bar">
    <rect x="230" y="675" width="440" height="10" rx="4" ry="4" fill="#0f172a"/>
    <text x="685" y="684" font-size="10" font-weight="700" fill="#0369a1">&lt;&lt;Fork&gt;&gt; (Parallel Activities)</text>
  </g>
  
  <!-- Parallel Branch Left 1: Post-Care & Rest -->
  <g id="act-postcare" filter="url(#actShadow)">
    <rect x="210" y="720" width="180" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="300" y="742" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Provide Refreshments</text>
    <text x="300" y="757" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">&amp; Post-Care Rest</text>
  </g>
  
  <!-- Parallel Branch Left 2: Issue Certificate -->
  <g id="act-cert" filter="url(#actShadow)">
    <rect x="210" y="805" width="180" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="300" y="827" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Issue Donation</text>
    <text x="300" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">Certificate &amp; SMS</text>
  </g>
  
  <!-- Parallel Branch Right 1: Update Blood Stock -->
  <g id="act-stock" filter="url(#actShadow)">
    <rect x="510" y="720" width="180" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="600" y="742" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Increment Stock</text>
    <text x="600" y="757" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">(Atomic DB Update)</text>
  </g>
  
  <!-- Parallel Branch Right 2: Evaluate Safety Thresholds -->
  <g id="act-buffer" filter="url(#actShadow)">
    <rect x="510" y="805" width="180" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="600" y="827" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Evaluate Buffer</text>
    <text x="600" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">Safety Thresholds</text>
  </g>
  
  <!-- ==================== JOIN BAR (SYNCHRONIZATION) ==================== -->
  <g id="join-bar">
    <rect x="230" y="890" width="440" height="10" rx="4" ry="4" fill="#0f172a"/>
    <text x="685" y="899" font-size="10" font-weight="700" fill="#0369a1">&lt;&lt;Join&gt;&gt; (Synchronized)</text>
  </g>
  
  <!-- Action 5: Log Session Complete in Database -->
  <g id="act-log" filter="url(#actShadow)">
    <rect x="350" y="930" width="200" height="50" rx="15" ry="15" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <text x="450" y="952" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Log Session Complete</text>
    <text x="450" y="967" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">(donations Table)</text>
  </g>
  
  <!-- Merge Node -->
  <g id="merge-node">
    <polygon points="450,1010 465,1025 450,1040 435,1025" fill="#38bdf8" stroke="#0284c7" stroke-width="1.6"/>
  </g>
  
  <!-- ==================== FINAL / END NODE (Bullseye) ==================== -->
  <g id="final-node">
    <circle cx="450" cy="1088" r="14" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="450" cy="1088" r="8" fill="#0f172a"/>
  </g>
  
  <!-- Legend Note -->
  <g id="act-legend" transform="translate(180, 1115)">
    <text x="270" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">UML 2.5 Standard Notation: Start (Filled Circle) | Action (Rounded Rect) | Fork/Join (Solid Bar) | End (Bullseye)</text>
  </g>
</svg>